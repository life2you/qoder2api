<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>qoder2api 控制台登录</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.82);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(148, 163, 184, 0.2);
      --input-focus: #38bdf8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
      --info-box-bg: rgba(56, 189, 248, 0.08);
      --info-box-border: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 75%, #090d16 100%);
      color: var(--text);
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 24px rgba(56, 189, 248, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .logo-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .hint-box {
      background: var(--info-box-bg);
      border: 1px solid var(--info-box-border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      color: #bae6fd;
      line-height: 1.5;
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .hint-box svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px;
      stroke: #38bdf8;
    }

    .hint-box strong {
      color: #fff;
      font-weight: 600;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      stroke: var(--muted);
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 42px 0 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--input-focus);
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: transparent;
      border: 0;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      border-radius: 6px;
      transition: color 0.15s;
    }

    .toggle-pwd:hover {
      color: #fff;
    }

    .toggle-pwd svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    button[type="submit"] {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    button[type="submit"]:hover {
      background: linear-gradient(135deg, #60a5fa 0%, #1d4ed8 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 16px;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.2s ease;
    }

    .alert.show {
      display: flex;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      flex-shrink: 0;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        </div>
        <div class="brand-text">
          <h1>qoder2api</h1>
          <p>控制台管理登录 · Web Console</p>
        </div>
      </div>

      <div class="hint-box">
        <svg fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><line x1="12" y1="16" x2="12" y2="12" stroke-width="2"/><line x1="12" y1="8" x2="12.01" y2="8" stroke-width="2"/></svg>
        <div>预设账号：<strong>admin</strong> &nbsp;|&nbsp; 预设密码：<strong>admin888</strong><br>登录后可在「设置」中随时进行修改。</div>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">控制台账号</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="username" type="text" autocomplete="username" placeholder="请输入账号（默认 admin）" value="admin" required autofocus />
          </div>
        </div>

        <div class="field">
          <label for="password">控制台密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码（默认 admin888）" value="admin888" required />
            <button type="button" class="toggle-pwd" id="togglePwd" title="显示/隐藏密码">
              <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button id="submitBtn" type="submit">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">进入控制台</span>
        </button>

        <div class="alert error" id="alertBox">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="alertMsg">账号或密码错误</span>
        </div>
      </form>
    </div>

    <div class="footer">
      Bridge API 接入仍使用独立的 API Key (默认 qccg)
    </div>
  </div>

  <script>
    // 若已登录直接跳转控制台首页
    fetch('/api/auth/me')
      .then(r => { if (r.ok) location.replace('/'); })
      .catch(() => {});

    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const togglePwd = document.getElementById('togglePwd');

    // 密码明文/暗文切换
    togglePwd.addEventListener('click', () => {
      const isPwd = passwordInput.type === 'password';
      passwordInput.type = isPwd ? 'text' : 'password';
      togglePwd.innerHTML = isPwd
        ? `<svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.remove('show');
      spinner.style.display = 'inline-block';
      btnText.textContent = '验证中...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value.trim(),
          }),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || '登录失败，请核对账号与密码');
        }

        btnText.textContent = '登录成功，正在进入...';
        setTimeout(() => {
          location.replace('/');
        }, 150);
      } catch (err) {
        alertMsg.textContent = err.message || String(err);
        alertBox.classList.add('show');
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = '进入控制台';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
